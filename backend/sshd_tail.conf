# sshd hardening for GPU Platform user containers.
#
# Jupyter kernel channels are local processes inside the same container and
# never traverse sshd, so disabling SSH forwarding does not affect notebooks.
# Forwarding is disabled purely to stop users tunnelling from their box into
# the Docker network (other users' containers, the Docker daemon socket on
# 172.x, cloud metadata endpoints, etc.).

# The platform installs its key in its own file, read in addition to the
# user's.  A workspace can be somebody's real home directory, and overwriting
# ~/.ssh/authorized_keys there would take away their access to this machine.
AuthorizedKeysFile /platform/authorized_keys .ssh/authorized_keys

# Block TCP forwarding (pivot into the internal Docker network)
DisableForwarding yes

# Only the per-user account may log in; root has no password at all
PermitRootLogin no
PasswordAuthentication yes
PermitEmptyPasswords no
X11Forwarding no

# Keep idle GPU sessions alive through NAT/firewalls
ClientAliveInterval 120
ClientAliveCountMax 10

# Sane crypto + limits
MaxAuthTries 6
MaxSessions 10
UseDNS no
