# Edge proxy, only used with HTTP_MODE=edge (compose profile "edge").
# On a host that already runs a web server, use HTTP_MODE=host instead and
# nginx/host/gpu-platform.conf.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    client_max_body_size 2g;

    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;

    # Upgrade only when the client asked for it (keep-alive stays intact
    # for ordinary REST calls on /api/).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:80;
    }

    server {
        listen 80;
        server_name _;

        # ── REST API + live-resource WebSocket ───────────────────────────
        location ^~ /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # The OUTERMOST proxy replaces X-Forwarded-For rather than appending to
        # it.  `$proxy_add_x_forwarded_for` keeps whatever the client sent and
        # adds the real address after it, so a client that sends its own header
        # decides what the platform records: the audit log takes the first entry,
        # and a forged one lands there instead of the caller.  Overwriting here
        # discards the client's claim; the frontend container then appends this
        # proxy, and the first entry is the real caller again.

        # ── JupyterLab (HTTP + kernel WebSockets + terminals) ────────────
        # `^~` stops any regex location (e.g. a static-asset cache block) from
        # claiming proxied URLs: nginx matches regex locations before prefix
        # ones, and most of JupyterLab is served from paths ending in .js/.css.
        # The OUTERMOST proxy replaces X-Forwarded-For rather than appending to
    # it.  `$proxy_add_x_forwarded_for` keeps whatever the client sent and
    # adds the real address after it, so a client that sends its own header
    # decides what the platform records: the audit log takes the first entry,
    # and a forged one lands there instead of the caller.  Overwriting here
    # discards the client's claim; the frontend container then appends this
    # proxy, and the first entry is the real caller again.
    location ^~ /jupyter/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout  86400s;
            proxy_send_timeout  86400s;
            proxy_buffering     off;
        }

        # ── React frontend (catch-all) ───────────────────────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
