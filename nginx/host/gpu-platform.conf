# GPU Platform, server block for an nginx ALREADY RUNNING ON THE HOST
# (HTTP_MODE=host).  The compose stack publishes the frontend container on
# 127.0.0.1:7080 and never touches :80/:443, so this file can live alongside
# every other site the machine serves.
#
# Install:
#   sudo cp nginx/host/gpu-platform.conf /etc/nginx/sites-available/gpu-platform
#   sudo ln -sf /etc/nginx/sites-available/gpu-platform /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: run `sudo certbot --nginx -d <your-domain>` afterwards; certbot rewrites
# this block in place and adds the :443 listener + redirect.

# Upgrade the connection only when the client asked to, a hard-coded
# `Connection: upgrade` breaks keep-alive for ordinary REST calls.
# NOTE: if another site on this host already defines $connection_upgrade,
# delete this map block (nginx allows only one definition per name).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream gpu_platform {
    server 127.0.0.1:7080;   # must match WEB_BIND:WEB_PORT in .env
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name workspace.duthu.net;

    # Notebooks and datasets are uploaded through this proxy.
    client_max_body_size 2g;

    access_log /var/log/nginx/gpu-platform.access.log;
    error_log  /var/log/nginx/gpu-platform.error.log;

    # The OUTERMOST proxy replaces X-Forwarded-For rather than appending to
    # it.  `$proxy_add_x_forwarded_for` keeps whatever the client sent and
    # adds the real address after it, so a client that sends its own header
    # decides what the platform records: the audit log takes the first entry,
    # and a forged one lands there instead of the caller.  Overwriting here
    # discards the client's claim; the frontend container then appends this
    # proxy, and the first entry is the real caller again.

    # ── Jupyter: kernels and terminals hold their WebSocket open for the
    #    whole computation, so this location needs day-long timeouts and
    #    no response buffering. ─────────────────────────────────────────
    # `^~` stops any regex location (e.g. a static-asset cache block) from
    # claiming proxied URLs: nginx matches regex locations before prefix ones,
    # and most of JupyterLab is served from paths ending in .js/.css.
    location ^~ /jupyter/ {
        proxy_pass         http://gpu_platform;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering    off;
    }

    # ── REST API + the live-resource WebSocket (/api/gpu/ws) ────────────
    location ^~ /api/ {
        proxy_pass         http://gpu_platform;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Starting a session waits for the user's container to answer.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── React SPA ───────────────────────────────────────────────────────
    location / {
        proxy_pass         http://gpu_platform;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
