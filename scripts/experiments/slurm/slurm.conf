# E3: one node whose "memory" stands for one GPU's memory, so jobs are packed
# by the reservation they declare (--mem), as the platform packs them.
ClusterName=e3
SlurmctldHost=localhost
SlurmUser=slurm
AuthType=auth/munge
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
JobAcctGatherType=jobacct_gather/none
ReturnToService=2
# 23.11 counts 16 CPUs on this hybrid i9 (21.08 counted 32); keep the
# configured 32 so that CPUs never limit a run, as before.
SlurmdParameters=config_overrides
MpiDefault=none
SelectType=select/cons_tres
SelectTypeParameters=CR_CPU_Memory
SchedulerType=sched/backfill
SchedulerParameters=bf_interval=5,bf_resolution=60,sched_min_interval=0
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=localhost
AccountingStorageEnforce=associations,limits
# Fair share with every user an equal share, usage decaying with a half-life
# scaled like the rest of the experiment (6 h -> 6 min); a small age weight
# breaks ties by submission time.
PriorityType=priority/multifactor
PriorityDecayHalfLife=0-0:06:00
PriorityCalcPeriod=1
PriorityWeightFairshare=100000
PriorityWeightAge=1
PriorityMaxAge=1-0
PriorityFavorSmall=NO
PriorityWeightJobSize=0
PriorityWeightPartition=0
PriorityWeightQOS=0
NodeName=localhost CPUs=32 RealMemory=__MEM__ State=UNKNOWN
PartitionName=gpu Nodes=localhost Default=YES MaxTime=INFINITE State=UP
