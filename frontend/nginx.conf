# Frontend container: serves the built SPA and proxies the API.
#
# In HTTP_MODE=host this container IS the public entry point (the host's own
# nginx sits in front of it), so it must handle every path the platform uses,
# including the WebSockets, which the previous version dropped on /api/.

# Upgrade only when the client actually asked for it.  Hard-coding
# `Connection: upgrade` on /api/ breaks keep-alive for ordinary REST calls.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS.  nginx resolves a literal hostname in proxy_pass
    # exactly once, when it loads its config, and then caches that address for
    # the life of the process.  A backend container recreated by a deployment
    # comes back on a different address, so every proxied request kept going
    # to the old one: the API answered fine on its own port while the whole
    # site returned 502.  With a variable in proxy_pass, nginx resolves per
    # request instead and honours this TTL.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend http://backend:8000;

    # Datasets and notebooks travel through here in host mode.
    client_max_body_size 2g;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # ── REST API + the live-resource WebSocket (/api/gpu/ws) ─────────────
    # `^~` is load-bearing: nginx evaluates regex locations BEFORE prefix ones,
    # so without it the static-asset cache block below swallows every proxied
    # URL ending in .js/.css/.ico, which is most of JupyterLab.
    location ^~ /api/ {
        proxy_pass         $api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # Session start waits for the user's container to answer (~60s).
        proxy_send_timeout 300s;
    }

    # ── Jupyter: HTTP, kernel WebSockets, terminals ──────────────────────
    # `^~`, see the note on /api/ above.  JupyterLab is served from
    # <base_url>static/lab/main.<hash>.js; without this modifier that request
    # matched the regex block, was never proxied, and 404'd from this server,
    # the page loaded but stayed blank.
    location ^~ /jupyter/ {
        proxy_pass         $api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Kernels stay connected through long computations.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering    off;
    }

    # ── Static assets of the SPA itself ──────────────────────────────────
    # Only reached for paths the `^~` locations above did not claim.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── React SPA, all unknown paths fall back to index.html ────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
