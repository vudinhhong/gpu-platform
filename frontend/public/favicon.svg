<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="#4F46E5"/>
  <!-- GPU chip body -->
  <rect x="16" y="16" width="32" height="32" rx="4" fill="#818CF8" opacity="0.3"/>
  <rect x="19" y="19" width="26" height="26" rx="3" fill="#6366F1" stroke="#A5B4FC" stroke-width="1"/>
  <!-- Center core -->
  <rect x="25" y="25" width="14" height="14" rx="2" fill="#4F46E5" stroke="#C7D2FE" stroke-width="1"/>
  <!-- Pin left -->
  <rect x="11" y="24" width="6" height="2.5" rx="1" fill="#A5B4FC"/>
  <rect x="11" y="30" width="6" height="2.5" rx="1" fill="#A5B4FC"/>
  <rect x="11" y="36" width="6" height="2.5" rx="1" fill="#A5B4FC"/>
  <!-- Pin right -->
  <rect x="47" y="24" width="6" height="2.5" rx="1" fill="#A5B4FC"/>
  <rect x="47" y="30" width="6" height="2.5" rx="1" fill="#A5B4FC"/>
  <rect x="47" y="36" width="6" height="2.5" rx="1" fill="#A5B4FC"/>
  <!-- Pin top -->
  <rect x="24" y="11" width="2.5" height="6" rx="1" fill="#A5B4FC"/>
  <rect x="30" y="11" width="2.5" height="6" rx="1" fill="#A5B4FC"/>
  <rect x="36" y="11" width="2.5" height="6" rx="1" fill="#A5B4FC"/>
  <!-- Pin bottom -->
  <rect x="24" y="47" width="2.5" height="6" rx="1" fill="#A5B4FC"/>
  <rect x="30" y="47" width="2.5" height="6" rx="1" fill="#A5B4FC"/>
  <rect x="36" y="47" width="2.5" height="6" rx="1" fill="#A5B4FC"/>
</svg>
